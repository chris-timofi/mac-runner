name: Inspect a curl script

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of a script to fetch (optional - leave blank for a bare desktop)"
        required: false
        default: ""
      run_it:
        description: "Actually execute it? (false = just download and read it)"
        type: boolean
        default: false
      desktop:
        description: "Open a full macOS desktop I can VNC into"
        type: boolean
        default: false
      hold_minutes:
        description: "How long to hold the desktop open"
        default: "60"

jobs:
  inspect:
    runs-on: macos-14   # Apple Silicon (M1), free on public repos
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Machine facts
        run: |
          mkdir -p out
          { uname -a; sysctl -n machdep.cpu.brand_string; sw_vers; } | tee out/machine.txt

      # ---------- static pass: never executes anything ----------

      - name: Fetch the script (do not run)
        if: inputs.url != ''
        run: |
          curl -fsSL --max-time 60 -D out/headers.txt "${{ inputs.url }}" -o out/script.sh
          wc -c out/script.sh
          shasum -a 256 out/script.sh | tee out/script.sha256

      - name: Read it
        if: inputs.url != ''
        run: cat out/script.sh

      - name: What it touches (grep for the usual suspects)
        if: inputs.url != ''
        run: |
          grep -nE 'curl|wget|sudo|launchctl|LaunchAgents|LaunchDaemons|/etc/|~/\.|chmod \+x|osascript|defaults write|security |keychain|nc |base64|eval|ssh' \
            out/script.sh | tee out/suspects.txt || echo "nothing matched"

      # ---------- watchers: start BEFORE anything runs ----------

      - name: Install the HTTPS interceptor
        if: inputs.run_it || inputs.desktop
        run: brew install --quiet mitmproxy

      - name: Start all recorders
        if: inputs.run_it || inputs.desktop
        run: |
          sudo fs_usage -w -f filesys > out/files.live.log 2>/dev/null &
          echo $! > out/pid.fsusage

          sudo tcpdump -i any -n -s 0 -w out/traffic.pcap > /dev/null 2>&1 &
          echo $! > out/pid.tcpdump

          mitmdump --quiet --set confdir="$HOME/.mitmproxy" \
                   -w out/https.flows --listen-port 8888 > out/mitm.log 2>&1 &
          echo $! > out/pid.mitm
          sleep 8
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$HOME/.mitmproxy/mitmproxy-ca-cert.pem"

          ( while :; do date +%s.%N; ps -Ao pid,ppid,user,command; sleep 0.5; done ) \
            > out/processes.live.log 2>&1 &
          echo $! > out/pid.ps

          # macOS's own system log — what Wazuh reads
          sudo log stream --style compact --level info \
            --predicate 'eventMessage CONTAINS[c] "exec" OR subsystem CONTAINS "com.apple.xpc" OR subsystem CONTAINS "securityd" OR subsystem CONTAINS "network"' \
            > out/system.log 2>&1 &
          echo $! > out/pid.log

          sleep 2

      - name: Snapshot BEFORE (incl. every hiding spot)
        if: inputs.run_it || inputs.desktop
        run: bash scripts/snapshot.sh before

      # ---------- full desktop over VNC ----------

      - name: Open the desktop and tunnel it out
        if: inputs.desktop
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then echo "::error::repo secret VNC_PASSWORD is not set"; exit 1; fi
          # the runner reaps background processes at step end unless this is cleared
          export RUNNER_TRACKING_ID=""
          # Changing the runner account's password needs the old one, which we
          # don't have. Creating a BRAND NEW admin user doesn't. macOS gives a
          # non-console user their own virtual desktop over screen sharing.
          sudo sysadminctl -addUser vnc -fullName "VNC" -password "$VNC_PASSWORD" -admin 2>&1 || true
          sudo dscl . -append /Groups/admin GroupMembership vnc 2>&1 || true
          sudo dscl . -append /Groups/com.apple.access_ssh GroupMembership vnc 2>&1 || true
          echo "--- can the new user actually authenticate? ---"
          dscl . -authonly vnc "$VNC_PASSWORD" && echo "AUTH OK" || echo "AUTH FAILED"

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -users vnc,runner -access -on -privs -all 2>&1 || true
          # give ARDAgent permission to record the screen, or VNC shows black
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteDesktop.agent',0,2,4,1,NULL,NULL,NULL,'UNUSED',NULL,0,1687335058,NULL,NULL,'UNUSED',0);" 2>&1 || true
          sudo launchctl kickstart -k system/com.apple.screensharing 2>&1 || true
          sudo launchctl enable system/com.apple.screensharing 2>&1 || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>&1 || true
          sleep 5
          echo "--- is anything listening on 5900? ---"
          netstat -an | grep 5900 || echo "NOTHING ON 5900"

          # noVNC turns the Mac's screen into a plain web page, so a
          # Cloudflare quick tunnel (HTTP only) can carry it to a browser.
          brew install --quiet cloudflared
          python3 -m pip install --break-system-packages --quiet websockify 2>&1 | tail -2 || \
            python3 -m pip install --quiet websockify
          git clone --depth 1 -q https://github.com/novnc/noVNC.git "$HOME/noVNC"
          NOVNC_WEB="$HOME/noVNC"
          nohup python3 -m websockify --web "$NOVNC_WEB" 6080 localhost:5900 </dev/null > out/websockify.log 2>&1 &
          echo $! > out/pid.websockify
          sleep 5
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate </dev/null > out/tunnel.log 2>&1 &
          echo $! > out/pid.cloudflared
          sleep 20
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' out/tunnel.log | head -1)

          # A browser terminal too — this one we control the password for,
          # so it works even when macOS refuses the screen-sharing login.
          brew install --quiet ttyd
          nohup ttyd -p 7681 -W -c "runner:${VNC_PASSWORD}" /bin/bash -l </dev/null > out/ttyd.log 2>&1 &
          echo $! > out/pid.ttyd
          sleep 3
          nohup cloudflared tunnel --url http://localhost:7681 --no-autoupdate </dev/null > out/tunnel2.log 2>&1 &
          echo $! > out/pid.cloudflared2
          sleep 20
          URL2=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' out/tunnel2.log | head -1)

          mkdir -p tunnel
          {
            echo "TERMINAL (works for sure):"
            echo "  $URL2"
            echo "  user: runner   password: <the VNC_PASSWORD secret>"
            echo ""
            echo "DESKTOP (may reject the login):"
            echo "  ${URL}/vnc.html?host=$(echo $URL | sed 's|https://||')&port=443&encrypt=1"
            echo ""
            echo "  log in as user 'vnc' with the same password"
            echo ""
            echo "--- IS ANYTHING LISTENING ON 5900? ---"
            netstat -an | grep -E '\.5900|\.6080|\.7681' || echo "NOTHING LISTENING"
            echo "--- screen sharing daemon ---"
            sudo launchctl print system/com.apple.screensharing 2>&1 | head -12
            echo "--- websockify log ---"
            tail -20 out/websockify.log 2>&1
            echo "--- ttyd log ---"
            tail -20 out/ttyd.log 2>&1
            echo "--- does the vnc user authenticate? ---"
            dscl . -authonly vnc "$VNC_PASSWORD" && echo "AUTH OK" || echo "AUTH FAILED"
            dscl . -list /Users | grep -E '^(vnc|runner)$'
            echo "--- who is logged in ---"
            who; stat -f '%Su' /dev/console
          } > tunnel/URL.txt
          echo "=============================================="
          cat tunnel/URL.txt
          echo "=============================================="

      - name: Publish the address so it is readable while the job runs
        if: inputs.desktop
        uses: actions/upload-artifact@v4
        with:
          name: tunnel
          path: tunnel/

      - name: Hold the desktop open
        if: inputs.desktop
        run: |
          echo "Holding for ${{ inputs.hold_minutes }} minutes. Cancel the job when you're done."
          sleep $(( ${{ inputs.hold_minutes }} * 60 ))

      # ---------- or just run it, fully traced ----------

      - name: RUN IT (every command line logged)
        if: inputs.run_it && !inputs.desktop
        env:
          HTTP_PROXY: http://127.0.0.1:8888
          HTTPS_PROXY: http://127.0.0.1:8888
        run: |
          set +e
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY"
          bash -x out/script.sh > out/run.stdout.log 2> out/run.trace.log
          echo "exit code: $?" | tee out/run.exitcode
          cat out/run.trace.log

      # ---------- stop, diff, package ----------

      - name: Stop recorders and diff the machine
        if: always() && (inputs.run_it || inputs.desktop)
        run: |
          sleep 3
          bash scripts/snapshot.sh after
          for p in out/pid.*; do sudo kill "$(cat $p)" 2>/dev/null || true; done
          sleep 2
          bash scripts/report.sh

      - name: Keep everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspection
          path: out/
